<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>NNAPER</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="menu" class="dock-left">
  <div class="menu-header">
    <h3>Sterowanie Warstwami</h3>
    <div class="panel-actions">
      <button class="action-btn" id="btn-switch-side" title="Przerzuć panel na drugą stronę">⇄</button>
      <button class="action-btn" id="btn-minimize" title="Zwiń / Rozwiń panel">–</button>
      <button class="action-btn" id="btn-back-location" title="Wróć do poprzedniego widoku">←</button>
      <button class="action-btn" id="btn-close-location" title="Zamknij lokalizację">✕</button>
    </div>
  </div>

  <div class="menu-body">
    <button onclick="window.location.href='playback.html'" 
            style="width: 100%; margin-bottom: 10px; background: #0284c7; color: #fff; border: 1px solid #38bdf8; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer;">
      🎬 Przejdź do Odtwarzacza Trasy
    </button>

    <div id="tree-container"></div>
  </div>
</div>

<div id="search-container">
  <input type="text" id="search-input" placeholder="Szukaj adresu lub miejsca..." autocomplete="off" />
  <div id="search-suggestions"></div>
</div>

<div id="route-planner-panel" class="route-planner-panel" aria-hidden="true">
  <div class="route-planner-header">
    <h3>Planowanie trasy</h3>
    <button class="route-action-btn route-planner-back-original" id="btn-route-back-to-original" title="Wróć do pierwotnej lokalizacji" aria-label="Wróć do pierwotnej lokalizacji">←</button>
  </div>
  <div id="inline-route-context-menu" class="inline-route-context-menu">
    <button id="inline-context-stop">Dodaj punkt trasy</button>
  </div>
  <div class="route-planner-navigation">
    <button class="route-action-btn" id="btn-route-back-to-location" hidden>Wróć do poprzedniej lokalizacji</button>
  </div>
  <div id="route-start-suggestions" class="route-start-suggestions"></div>
  <div id="route-planner-hint">Użyj + między punktami albo kliknij prawym przyciskiem mapę.</div>
  <div class="route-list-section">
    <ul id="route-planner-stops" class="route-planner-list"></ul>
  </div>
  <div id="route-planner-stats"></div>
</div>

<div id="map-context-menu" class="inline-route-context-menu">
  <button id="map-context-route">Wyznacz trasę z tego miejsca</button>
  <button id="map-context-info">Pokaż informacje o tym miejscu</button>
</div>

<div id="map"></div>

<script src="runtime-config.js"></script>
<script src="runtime-config.local.js"></script>
<script src="layers.js"></script>
<script src="app.js?v=20261012-2"></script>
<script src="route-inline.js?v=20261012-2"></script>
</body>
</html>
