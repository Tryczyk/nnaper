<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Naper - Studio Map Pomorskie 3D</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- GŁÓWNY PANEL WARSTW -->
<div id="menu" class="dock-left">
  <div class="menu-header">
    <h3>Sterowanie Warstwami</h3>
    <div class="panel-actions">
      <button class="action-btn" id="btn-switch-side" title="Przerzuć panel na drugą stronę">⇄</button>
      <button class="action-btn" id="btn-minimize" title="Zwiń / Rozwiń panel">–</button>
    </div>
  </div>

  <div class="menu-body">
    <div id="tree-container"></div>
  </div>
</div>

<!-- PANEL DETALI EPOKI (PEŁNE DANE I SATELITY) -->
<div id="point-panel" class="dock-right">
  <div class="point-header">
    <h3>Pełne Dane Epoki & Satelity</h3>
    <div class="panel-actions">
      <button class="action-btn" id="btn-close-point" title="Zamknij panel punktu">✕</button>
    </div>
  </div>
  <div class="point-body" id="pp-content">
    <em>Wybierz punkt, aby zobaczyć szczegóły...</em>
  </div>
</div>

<div id="map"></div>

<!-- SKRYPTY APLIKACJI -->
<script src="layers.js"></script>
<script src="app.js"></script>
</body>
</html>
