<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <title>Napper - Odtwarzacz Trasy</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/pmtiles@3.0.7/dist/pmtiles.js"></script>
  <script src="runtime-config.js"></script>
  <script src="runtime-config.local.js"></script>
  <script src="layers.js"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; font-family: system-ui, sans-serif; background: #090d16; overflow: hidden; color: #f8fafc; }
    #map { width: 100%; height: 100%; }

    #top-bar {
      position: absolute; top: 15px; left: 15px; z-index: 20;
      display: flex; align-items: center; gap: 10px;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155;
      padding: 8px 14px; border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    #top-bar select, #top-bar button {
      background: #1e293b; color: #f8fafc; border: 1px solid #475569;
      padding: 6px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    #top-bar button:hover { background: #334155; }

    #hud-panel {
      position: absolute; top: 15px; right: 15px; z-index: 20;
      background: rgba(15, 23, 42, 0.92); border: 1px solid #334155;
      padding: 12px 18px; border-radius: 8px; width: 220px;
      box-shadow: 0 4px 14px rgba(0,0,0,0.5);
    }
    .hud-row { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 12px; }
    .hud-val { font-weight: bold; color: #38bdf8; }

    #bottom-controls {
      position: absolute; bottom: 0; left: 0; right: 0; z-index: 20;
      background: linear-gradient(180deg, rgba(15, 23, 42, 0) 0%, rgba(15, 23, 42, 0.95) 35%, rgba(9, 13, 22, 1) 100%);
      padding: 15px 24px 20px 24px; display: flex; flex-direction: column; gap: 10px;
    }
    #timeline-slider { width: 100%; cursor: pointer; accent-color: #38bdf8; height: 6px; }
    .ctrl-row { display: flex; align-items: center; justify-content: space-between; }
    .ctrl-left, .ctrl-right { display: flex; align-items: center; gap: 10px; }
    .btn-ctrl {
      background: #1e293b; color: #f8fafc; border: 1px solid #475569;
      padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
    }
    .btn-ctrl:hover { background: #38bdf8; color: #090d16; }

    .car-marker {
      font-size: 26px; line-height: 1; user-select: none;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
      transition: transform 0.08s linear;
    }
  </style>
</head>
<body>

<div id="top-bar">
  <button onclick="window.location.href='tile_map.html'">← Wróć do Mapy</button>
  <label for="date-select" style="font-size: 13px;">Dzień:</label>
  <select id="date-select"><option>Ładowanie dat...</option></select>
  <label for="sat-view" style="font-size: 13px; margin-left: 10px;">Satelity:</label>
  <select id="sat-view">
    <option value="none">Ukryte</option>
    <option value="local" selected>Blisko (Skyplot)</option>
    <option value="subpoint">Daleko (Orbita MEO)</option>
  </select>
</div>

<div id="hud-panel">
  <div class="hud-row"><span>Godzina:</span><span id="hud-time" class="hud-val">--:--:--</span></div>
  <div class="hud-row"><span>Prędkość:</span><span id="hud-speed" class="hud-val">0.0 km/h</span></div>
  <div class="hud-row"><span>altitude:</span><span id="hud-altitude" class="hud-val">-- m</span></div>
  <div class="hud-row"><span>g_x:</span><span id="hud-gx" class="hud-val">--</span></div>
  <div class="hud-row"><span>g_y:</span><span id="hud-gy" class="hud-val">--</span></div>
  <div class="hud-row"><span>g_z:</span><span id="hud-gz" class="hud-val">--</span></div>
  <div class="hud-row"><span>Dystans dnia:</span><span id="hud-dist" class="hud-val">0.0 km</span></div>
  <div class="hud-row"><span>Średnia prędkość:</span><span id="hud-avg-speed" class="hud-val">0.0 km/h</span></div>
</div>

<div id="bottom-controls">
  <input type="range" id="timeline-slider" min="0" max="100" value="0" />
  <div class="ctrl-row">
    <div class="ctrl-left">
      <button id="btn-play" class="btn-ctrl">▶ Odtwarzaj</button>
      <span id="hud-progress-info" style="font-size: 12px; color: #94a3b8;">0 / 0 epok</span>
    </div>
    <div class="ctrl-right">
      <span style="font-size: 12px;">Tempo:</span>
      <select id="speed-multiplier" style="background:#1e293b; color:#fff; border:1px solid #475569; padding:4px 8px; border-radius:4px;">
        <option value="1">1x (Real-time)</option>
        <option value="2">2x</option>
        <option value="5">5x</option>
        <option value="10">10x</option>
        <option value="30">30x</option>
        <option value="60" selected>60x</option>
      </select>
      <label style="font-size: 12px; display: flex; align-items: center; gap: 4px; cursor: pointer;">
        <input type="checkbox" id="chk-follow" checked style="accent-color: #38bdf8;" /> Śledź kamerą
      </label>
    </div>
  </div>
</div>

<div id="map"></div>

<script>
  const protocol = new pmtiles.Protocol();
  maplibregl.addProtocol("pmtiles", protocol.tile);

  const apiBaseUrl = (window.NNAPER_CONFIG?.API_BASE_URL || 'http://localhost:8000').replace(/\/$/, '');

  const map = new maplibregl.Map({
    container: 'map',
    center: [18.6466, 54.3520],
    zoom: 15,
    pitch: 50,
    style: MAP_STYLE
  });

  let carMarker = null;
  let trackData = [];
  let availableDates = [];
  let currentIndex = 0;
  let isPlaying = false;
  let totalDistanceDayKm = 0;

  let virtualTime = 0;
  let lastWallClockTime = 0;
  let animFrameId = null;

  function getDistanceKm(lat1, lon1, lat2, lon2) {
    const R = 6371;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;
    const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLon/2) * Math.sin(dLon/2);
    return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
  }

  function computeSubSatellitePoint(userLon, userLat, azimuthDeg, elevationDeg) {
    const R_E = 6371.0;
    const H_SAT = 20200.0;
    const R_SAT = R_E + H_SAT;

    const elRad = (Math.max(0.1, elevationDeg) * Math.PI) / 180.0;
    const azRad = (azimuthDeg * Math.PI) / 180.0;
    const latRad = (userLat * Math.PI) / 180.0;
    const lonRad = (userLon * Math.PI) / 180.0;

    const cosArg = (R_E / R_SAT) * Math.cos(elRad);
    const alpha = Math.acos(Math.min(1.0, Math.max(-1.0, cosArg)));
    const gamma = alpha - elRad;

    const sinLat2 = Math.sin(latRad) * Math.cos(gamma) + Math.cos(latRad) * Math.sin(gamma) * Math.cos(azRad);
    const lat2 = Math.asin(Math.min(1.0, Math.max(-1.0, sinLat2)));

    const y = Math.sin(azRad) * Math.sin(gamma) * Math.cos(latRad);
    const x = Math.cos(gamma) - Math.sin(latRad) * Math.sin(lat2);
    const lon2 = lonRad + Math.atan2(y, x);

    let satLat = (lat2 * 180.0) / Math.PI;
    let satLon = (lon2 * 180.0) / Math.PI;
    satLon = ((satLon + 540.0) % 360.0) - 180.0;

    return { lon: satLon, lat: satLat };
  }

  async function loadDates() {
    const sel = document.getElementById('date-select');
    try {
      const res = await fetch(`${apiBaseUrl}/api/dates-tree`, { cache: 'no-store' });
      const tree = await res.json();
      availableDates = [];
      Object.keys(tree).sort().forEach(y => {
        Object.keys(tree[y]).sort().forEach(m => {
          tree[y][m].sort().forEach(d => {
            availableDates.push(`${y}-${m}-${d}`);
          });
        });
      });

      sel.innerHTML = '';
      availableDates.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d; opt.innerText = d;
        sel.appendChild(opt);
      });

      if (availableDates.length > 0) {
        sel.value = availableDates[0];
        loadTrackForDay(availableDates[0]);
      }
    } catch (e) {
      sel.innerHTML = '<option>Błąd pobierania dat</option>';
    }
  }

  async function loadTrackForDay(dayStr) {
    pausePlayback();
    try {
      const res = await fetch(`${apiBaseUrl}/api/playback-day?day=${dayStr}`);
      if (!res.ok) {
        const errJson = await res.json().catch(() => ({}));
        throw new Error(errJson.detail || `HTTP ${res.status}`);
      }
      trackData = await res.json();
      currentIndex = 0;

      if (!trackData || !trackData.length) {
        document.getElementById('hud-progress-info').innerText = '0 / 0 epok (brak danych dla tego dnia)';
        return;
      }

      totalDistanceDayKm = 0;
      let speedSum = 0;
      for (let i = 0; i < trackData.length; i++) {
        speedSum += (trackData[i].speed_kmh || 0);
        if (i > 0) {
          totalDistanceDayKm += getDistanceKm(trackData[i-1].lat, trackData[i-1].lon, trackData[i].lat, trackData[i].lon);
        }
      }
      const avgSpeed = (speedSum / trackData.length).toFixed(1);
      document.getElementById('hud-dist').innerText = `${totalDistanceDayKm.toFixed(2)} km`;
      document.getElementById('hud-avg-speed').innerText = `${avgSpeed} km/h`;

      const slider = document.getElementById('timeline-slider');
      slider.max = trackData.length - 1;
      slider.value = 0;

      virtualTime = new Date(trackData[0].timestamp).getTime();

      map.flyTo({
        center: [trackData[0].lon, trackData[0].lat],
        zoom: 16,
        pitch: 50,
        essential: true
      });

      renderCarAt(0, true);
    } catch (err) {
      console.error("Szczegóły błędu backendu:", err);
      document.getElementById('hud-progress-info').innerText = `Błąd API: ${err.message}`;
    }
  }

  function updateSatellitesDisplay(point) {
    const mode = document.getElementById('sat-view').value;
    const linesSrc = map.getSource('satellites-lines-source');
    const ptsSrc = map.getSource('satellites-points-source');
    if (!linesSrc || !ptsSrc) return;

    if (mode === 'none' || !point.satellites || !point.satellites.length) {
      linesSrc.setData({ type: 'FeatureCollection', features: [] });
      ptsSrc.setData({ type: 'FeatureCollection', features: [] });
      return;
    }

    const lineFeatures = [];
    const pointFeatures = [];
    const pLon = point.lon;
    const pLat = point.lat;

    point.satellites.forEach(sat => {
      if (sat.azimuth === null || sat.azimuth === undefined) return;
      let sLon, sLat;
      if (mode === 'local') {
        const azRad = (sat.azimuth * Math.PI) / 180.0;
        const el = sat.elevation ?? 45;
        const dist = 0.045 * Math.cos((el * Math.PI) / 180.0);
        sLon = pLon + dist * Math.sin(azRad) * 1.5;
        sLat = pLat + dist * Math.cos(azRad);
      } else {
        const sub = computeSubSatellitePoint(pLon, pLat, sat.azimuth, sat.elevation || 0);
        sLon = sub.lon;
        sLat = sub.lat;
      }

      lineFeatures.push({
        type: 'Feature',
        geometry: { type: 'LineString', coordinates: [[pLon, pLat], [sLon, sLat]] }
      });
      pointFeatures.push({
        type: 'Feature',
        geometry: { type: 'Point', coordinates: [sLon, sLat] },
        properties: { label: `PRN ${sat.prn}\n${sat.elevation || 0}°` }
      });
    });

    linesSrc.setData({ type: 'FeatureCollection', features: lineFeatures });
    ptsSrc.setData({ type: 'FeatureCollection', features: pointFeatures });
  }

  function renderCarAt(index, centerCamera = false) {
    if (!trackData[index]) return;
    const pt = trackData[index];

    if (!carMarker) {
      const el = document.createElement('div');
      el.className = 'car-marker';
      el.innerText = '🚗';
      carMarker = new maplibregl.Marker({ element: el }).setLngLat([pt.lon, pt.lat]).addTo(map);
    } else {
      carMarker.setLngLat([pt.lon, pt.lat]);
    }

    const markerEl = carMarker.getElement();
    const d = new Date(pt.timestamp);
    document.getElementById('hud-time').innerText = d.toTimeString().split(' ')[0];
    document.getElementById('hud-speed').innerText = `${(pt.speed_kmh || 0).toFixed(1)} km/h`;
    document.getElementById('hud-altitude').innerText =
      pt.altitude === null || pt.altitude === undefined ? '-- m' : `${Number(pt.altitude).toFixed(2)} m`;
    document.getElementById('hud-gx').innerText = formatSensorValue(pt.g_x);
    document.getElementById('hud-gy').innerText = formatSensorValue(pt.g_y);
    document.getElementById('hud-gz').innerText = formatSensorValue(pt.g_z);
    document.getElementById('hud-progress-info').innerText = `${index + 1} / ${trackData.length} epok`;
    document.getElementById('timeline-slider').value = index;

    if (centerCamera || document.getElementById('chk-follow').checked) {
      map.easeTo({ center: [pt.lon, pt.lat], duration: 50 });
    }

    updateSatellitesDisplay(pt);
  }

  function formatSensorValue(value) {
    return value === null || value === undefined ? '--' : Number(value).toFixed(3);
  }

  function playbackLoop(now) {
    if (!isPlaying) return;

    const deltaWallClock = now - lastWallClockTime;
    lastWallClockTime = now;

    const multiplier = parseFloat(document.getElementById('speed-multiplier').value);
    virtualTime += deltaWallClock * multiplier;

    let targetIndex = currentIndex;
    while (targetIndex < trackData.length - 1) {
      const nextPtTime = new Date(trackData[targetIndex + 1].timestamp).getTime();
      const currPtTime = new Date(trackData[targetIndex].timestamp).getTime();

      if ((nextPtTime - currPtTime) > (5 * 60 * 1000) && virtualTime < nextPtTime) {
        virtualTime = nextPtTime;
      }

      if (virtualTime >= nextPtTime) {
        targetIndex++;
      } else {
        break;
      }
    }

    if (targetIndex !== currentIndex) {
      currentIndex = targetIndex;
      renderCarAt(currentIndex);
    }

    if (currentIndex >= trackData.length - 1) {
      const curDay = document.getElementById('date-select').value;
      const curDayIdx = availableDates.indexOf(curDay);
      if (curDayIdx !== -1 && curDayIdx + 1 < availableDates.length) {
        const nextDay = availableDates[curDayIdx + 1];
        document.getElementById('date-select').value = nextDay;
        loadTrackForDay(nextDay).then(() => startPlayback());
      } else {
        pausePlayback();
      }
      return;
    }

    animFrameId = requestAnimationFrame(playbackLoop);
  }

  function startPlayback() {
    if (!trackData.length) return;
    isPlaying = true;
    lastWallClockTime = performance.now();
    document.getElementById('btn-play').innerText = '⏸ Pauza';
    animFrameId = requestAnimationFrame(playbackLoop);
  }

  function pausePlayback() {
    isPlaying = false;
    if (animFrameId) cancelAnimationFrame(animFrameId);
    document.getElementById('btn-play').innerText = '▶ Odtwarzaj';
    if (trackData[currentIndex]) updateSatellitesDisplay(trackData[currentIndex]);
  }

  document.getElementById('btn-play').addEventListener('click', () => {
    if (isPlaying) pausePlayback();
    else startPlayback();
  });

  document.getElementById('timeline-slider').addEventListener('input', (e) => {
    pausePlayback();
    currentIndex = parseInt(e.target.value, 10);
    if (trackData[currentIndex]) {
      virtualTime = new Date(trackData[currentIndex].timestamp).getTime();
      renderCarAt(currentIndex, true);
    }
  });

  document.getElementById('date-select').addEventListener('change', (e) => {
    loadTrackForDay(e.target.value);
  });

  document.getElementById('sat-view').addEventListener('change', () => {
    if (trackData[currentIndex]) updateSatellitesDisplay(trackData[currentIndex]);
  });

  map.on('load', () => {
    map.addSource('satellites-lines-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addSource('satellites-points-source', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });

    map.addLayer({
      id: 'playback-sat-lines',
      source: 'satellites-lines-source',
      type: 'line',
      paint: { 'line-color': '#f59e0b', 'line-width': 2.0, 'line-dasharray': [3, 2] }
    });

    map.addLayer({
      id: 'playback-sat-points',
      source: 'satellites-points-source',
      type: 'circle',
      paint: { 'circle-color': '#f59e0b', 'circle-radius': 5.5, 'circle-stroke-width': 1.5, 'circle-stroke-color': '#ffffff' }
    });

    map.addLayer({
      id: 'playback-sat-labels',
      source: 'satellites-points-source',
      type: 'symbol',
      layout: {
        'text-field': ['get', 'label'],
        'text-size': 11,
        'text-offset': [0, 1.2],
        'text-anchor': 'top',
        'text-font': ['Open Sans Bold']
      },
      paint: { 'text-color': '#fef08a', 'text-halo-color': '#020617', 'text-halo-width': 2 }
    });


    loadDates();
  });
</script>
</body>
</html>
