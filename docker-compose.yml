services:
  db:
    image: postgis/postgis:16-3.4
    container_name: nnaper_db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-nnaper}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nnaper}
      - POSTGRES_DB=${POSTGRES_DB:-nnaper_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nnaper_pgdata:/var/lib/postgresql/data
      - ./init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    image: python:3.14-slim
    container_name: nnaper_api
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - DB_URL=postgresql://${POSTGRES_USER:-nnaper}:${POSTGRES_PASSWORD:-nnaper}@db:5432/${POSTGRES_DB:-nnaper_db}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://127.0.0.1:8080}
      - PYTHONPATH=/app
    command: >
      sh -c "pip install --no-cache-dir fastapi uvicorn 'psycopg[binary]' psycopg-pool python-dotenv &&
             uvicorn server:app --app-dir src --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:latest
    container_name: nnaper_osrm
    volumes:
      - ./osm_data:/data
    ports:
      - "${OSRM_PORT:-5000}:5000"
    environment:
      - OSM_FILE_NAME=${OSM_FILE_NAME:-pomorskie.osm.pbf}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "set -e;
       PBF=/data/$${OSM_FILE_NAME};
       BASE=$${PBF%.osm.pbf};
       if [ ! -f $${BASE}.osrm.mldgr ]; then
         osrm-extract -p /opt/car.lua $${PBF};
         osrm-partition $${BASE}.osrm;
         osrm-customize $${BASE}.osrm;
       fi;
       osrm-routed --algorithm mld $${BASE}.osrm"
    depends_on:
      tiles-downloader:
        condition: service_completed_successfully
    restart: unless-stopped

  tiles-downloader:
    image: alpine:latest
    container_name: nnaper_downloader
    volumes:
      - ./osm_data:/data
    environment:
      - OSM_FILE_NAME=${OSM_FILE_NAME:-pomorskie.osm.pbf}
      - PMTILES_FILE=${PMTILES_FILE:-pomorskie.pmtiles}
      - OSM_DOWNLOAD_BASE_URL=${OSM_DOWNLOAD_BASE_URL:-https://download.geofabrik.de/europe/poland}
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "apk add --no-cache curl &&
       if [ ! -f /data/$${PMTILES_FILE} ] && [ ! -f /data/$${OSM_FILE_NAME} ]; then
         echo '[DOCKER] Brak kafelkow i pliku /data/'$${OSM_FILE_NAME}'. Pobieranie PBF z Geofabrik...';
         REGION=$$(echo $${OSM_FILE_NAME} | sed 's/\.osm\.pbf//' | sed 's/\.pbf//');
         curl -L --fail $${OSM_DOWNLOAD_BASE_URL}/$${REGION}-latest.osm.pbf -o /data/$${OSM_FILE_NAME};
       else
         echo '[DOCKER] PBF lub kafelki juz istnieja. Pomijam pobieranie.';
       fi"

  tiles-generator:
    image: ghcr.io/onthegomap/planetiler:latest
    container_name: nnaper_planetiler
    depends_on:
      tiles-downloader:
        condition: service_completed_successfully
    environment:
      - JAVA_OPTS=${PLANETILER_JAVA_OPTS:--Xmx4g}
      - OSM_FILE_NAME=${OSM_FILE_NAME:-pomorskie.osm.pbf}
      - PMTILES_FILE=${PMTILES_FILE:-pomorskie.pmtiles}
    volumes:
      - ./osm_data:/data
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "if [ -f /data/$${PMTILES_FILE} ] && [ \"$(head -c 7 /data/$${PMTILES_FILE})\" = 'PMTiles' ]; then
         echo '[DOCKER] Poprawne archiwum /data/'$${PMTILES_FILE}' juz istnieje. Pomijam Planetiler.';
         exit 0;
       fi;
       echo '[DOCKER] Brak poprawnego archiwum PMTiles. Uruchamiam Planetiler.';
       exec java -cp @/app/jib-classpath-file com.onthegomap.planetiler.Main --osm-path=/data/$${OSM_FILE_NAME} --output=/data/$${PMTILES_FILE} --download"

  tiles-server:
    image: caddy:alpine
    container_name: nnaper_tiles_server
    depends_on:
      tiles-generator:
        condition: service_completed_successfully
    ports:
      - "${TILES_PORT:-8080}:8080"
    volumes:
      - .:/usr/share/caddy
    environment:
      - API_PUBLIC_URL=${API_PUBLIC_URL:-http://localhost:8000}
      - TILES_PUBLIC_URL=${TILES_PUBLIC_URL:-http://localhost:8080}
      - OSRM_PUBLIC_URL=${OSRM_PUBLIC_URL:-http://localhost:5000}
      - PHOTON_URL=${PHOTON_URL:-https://photon.komoot.io}
      - PHOTON_BBOX=${PHOTON_BBOX:-14.1,53.9,19.9,55.9}
      - PHOTON_SEARCH_LIMIT=${PHOTON_SEARCH_LIMIT:-50}
      - PMTILES_FILE=${PMTILES_FILE:-pomorskie.pmtiles}
    command: >
      sh -c "printf '%s\\n' \\
        \"window.NNAPER_CONFIG = Object.assign(window.NNAPER_CONFIG || {}, {\" \\
        \"  API_BASE_URL: '$${API_PUBLIC_URL}',\" \\
        \"  TILES_BASE_URL: '$${TILES_PUBLIC_URL}',\" \\
        \"  OSRM_URL: '$${OSRM_PUBLIC_URL}',\" \\
        \"  PHOTON_URL: '$${PHOTON_URL}',\" \\
        \"  PHOTON_BBOX: '$${PHOTON_BBOX}',\" \\
        \"  PHOTON_SEARCH_LIMIT: $${PHOTON_SEARCH_LIMIT},\" \\
        \"  PMTILES_FILE: '$${PMTILES_FILE}'\" \\
        \"});\" > /usr/share/caddy/maps/runtime-config.local.js && \\
        caddy file-server --root /usr/share/caddy --listen :8080 --access-log"
    restart: unless-stopped

  open-browser:
    image: alpine:latest
    container_name: nnaper_browser_launcher
    depends_on:
      tiles-server:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    environment:
      - PUBLIC_MAP_URL=${TILES_PUBLIC_URL:-http://localhost:8080}/maps/tile_map.html
    command: >
      "apk add --no-cache curl &&
       echo '[DOCKER] Oczekiwanie na serwer mapy...' &&
       until curl -s -f http://tiles-server:8080/maps/tile_map.html > /dev/null; do
         sleep 1;
       done &&
       echo '========================================================' &&
      echo '  MAPA GOTOWA: '$${PUBLIC_MAP_URL}' ' &&
       echo '========================================================'"

volumes:
  nnaper_pgdata: